$kind: http-request
url: "{{baseUrl}}/api/accounts/profile/"
method: GET
headers:
  Authorization: Bearer {{accessToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Email matches', function () {
          pm.expect(pm.response.json().email).to.eql('smoke@example.com');
      });
    language: text/javascript
order: 3000
