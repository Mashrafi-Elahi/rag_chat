$kind: http-request
url: "{{baseUrl}}/api/accounts/change-password/"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
body:
  type: json
  content: |-
    {
      "old_password": "SmokeTest123!",
      "new_password": "NewSmokeTest456!"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 5000
